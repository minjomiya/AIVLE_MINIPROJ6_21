version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17

  build:
    commands:
      - echo "Build backend"
      - cd Backend/bookapp
      - chmod +x gradlew
      - ./gradlew clean build
      - echo "Backend build completed on $(date)"

artifacts:
  base-directory: Backend/bookapp
  files:
    - build/libs/*.jar
    - appspec.yml
    - scripts/**/*

